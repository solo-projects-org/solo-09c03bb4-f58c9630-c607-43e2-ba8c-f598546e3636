services:
  scenic-api:
    build: .
    image: scenic-backfill-api:1.0.0
    container_name: scenic-backfill-api
    ports:
      - "8000:8000"
    volumes:
      - scenic-data:/data
    environment:
      SCENIC_DB_PATH: /data/scenic.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  scenic-data:
